name=Pico_USB_Disp
version=1.0.0
author=Hideto Kikuchi / PJラボ (@pcjpnet)
maintainer=Hideto Kikuchi / PJラボ (@pcjpnet)
sentence=Drive an external monitor from a microcontroller through a USB display adapter, with no PC or OS required.
paragraph=Output Full HD (1920x1080) video from a Raspberry Pi Pico / Pico 2 (USB host on two GPIOs via PIO) or an ESP32-S2/S3/P4. Also runs on Teensy 4.0/4.1 and on PC via libusb. Supported adapters: DisplayLink DL-1x0/1x5 on all platforms; MCT Trigger 6 and MacroSilicon MS912x/MS913x on ESP32-P4 and PC (USB High-Speed required). Resolution is selected automatically from the monitor's EDID. Simple partial-update drawing API, with optional LovyanGFX and LVGL v9 integration.
category=Display
url=https://github.com/htlabnet/Pico_USB_Disp
architectures=rp2040,esp32,avr
includes=usb_disp.h
